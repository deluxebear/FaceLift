name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  macos-tests:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run localization and Live Photo tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_localization.py tests/test_live_photo_converter.py -q

      - name: Type-check the app
        run: |
          swiftc -typecheck -sdk "$(xcrun --sdk macosx --show-sdk-path)" -parse-as-library \
            -target arm64-apple-macosx14.0 $(find App Model Workspaces -name '*.swift' | sort)

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run localization sync tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_localization.py -q

      - name: Derive version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure code signing and notarization
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Development build — using ad-hoc signing."
            exit 0
          fi
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ] || \
             [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Tag releases require MACOS_CERT_P12, MACOS_CERT_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8."
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/facelift.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 \
            | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' certificate found in the imported p12."
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "SIGN_IDENTITY=$IDENTITY"
            echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
            echo "NOTARIZE=1"
          } >> "$GITHUB_ENV"
          echo "Notarization enabled via App Store Connect API key."

      - name: Build FaceLift.app and FaceLift.dmg
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify bundle version
        run: |
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/FaceLift.app/Contents/Info.plist)"
          echo "Info.plist version: $PLIST_VERSION (expected $APP_VERSION)"
          test "$PLIST_VERSION" = "$APP_VERSION"
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Verify signature and notarization
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          codesign --verify --deep --strict --verbose=2 build/FaceLift.app
          spctl --assess --type execute --verbose=2 build/FaceLift.app
          xcrun stapler validate build/FaceLift.app

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: FaceLift-${{ steps.version.outputs.version }}-dmg
          path: build/FaceLift.dmg

      - name: Generate categorized release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
          else
            RANGE="${GITHUB_REF_NAME}"
          fi
          COMMITS="$RUNNER_TEMP/commits.txt"
          NOTES="$RUNNER_TEMP/release-notes.md"
          git log --no-merges --pretty='%H|%s' "$RANGE" > "$COMMITS"

          section() {
            local title="$1" pattern="$2"
            local body
            body=$(awk -F'|' -v pat="$pattern" -v repo="$GITHUB_REPOSITORY" \
              '$2 ~ pat { printf "- %s ([%s](https://github.com/%s/commit/%s))\n", $2, substr($1,1,7), repo, $1 }' \
              "$COMMITS")
            if [ -n "$body" ]; then
              printf '### %s\n\n%s\n\n' "$title" "$body" >> "$NOTES"
            fi
          }

          echo "## What's Changed / 更新内容" > "$NOTES"
          echo >> "$NOTES"
          section "✨ New Features / 新功能"   '^feat[(:!]'
          section "🐛 Bug Fixes / 修复"       '^fix[(:!]'
          section "⚡ Performance / 性能"     '^perf[(:]'
          section "🔧 Refactoring / 重构"     '^refactor[(:]'
          section "📖 Documentation / 文档"   '^docs[(:]'
          section "🧪 Tests / 测试"           '^test[(:]'
          section "🏗️ Build & CI / 构建"      '^(build|ci)[(:]'
          section "🧹 Chores / 杂项"          '^(chore|style|revert)[(:]'

          # Anything that does not follow a conventional-commit prefix.
          OTHER=$(awk -F'|' -v repo="$GITHUB_REPOSITORY" \
            '$2 !~ /^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)[(:]/ { printf "- %s ([%s](https://github.com/%s/commit/%s))\n", $2, substr($1,1,7), repo, $1 }' \
            "$COMMITS")
          if [ -n "$OTHER" ]; then
            printf '### 📦 Other / 其他\n\n%s\n\n' "$OTHER" >> "$NOTES"
          fi

          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}" >> "$NOTES"
          fi
          echo "--- release notes preview ---"
          cat "$NOTES"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE_FLAG="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FaceLift ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            $PRERELEASE_FLAG \
            build/FaceLift.dmg

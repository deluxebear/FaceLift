name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run localization sync tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_localization.py -q

      - name: Derive version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure code signing and notarization
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            echo "No signing secrets configured — falling back to ad-hoc signing."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/facelift.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 \
            | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' certificate found in the imported p12."
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY"
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
            echo "NOTARIZE=1" >> "$GITHUB_ENV"
            echo "Notarization enabled via App Store Connect API key."
          else
            echo "::warning::Signing configured but ASC API key secrets missing — skipping notarization."
          fi

      - name: Build FaceLift.app and FaceLift.dmg
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify bundle version
        run: |
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/FaceLift.app/Contents/Info.plist)"
          echo "Info.plist version: $PLIST_VERSION (expected $APP_VERSION)"
          test "$PLIST_VERSION" = "$APP_VERSION"
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Verify signature and notarization
        if: env.SIGN_IDENTITY != ''
        run: |
          codesign --verify --deep --strict --verbose=2 build/FaceLift.app
          spctl --assess --type execute --verbose=2 build/FaceLift.app
          xcrun stapler validate build/FaceLift.app
          codesign --verify --verbose=2 build/FaceLift.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceLift-${{ steps.version.outputs.version }}-dmg
          path: build/FaceLift.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: FaceLift ${{ steps.version.outputs.version }}
          files: build/FaceLift.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

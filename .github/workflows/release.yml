name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run localization sync tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_localization.py -q

      - name: Derive version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build FaceLift.app and FaceLift.dmg
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify bundle version
        run: |
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/FaceLift.app/Contents/Info.plist)"
          echo "Info.plist version: $PLIST_VERSION (expected $APP_VERSION)"
          test "$PLIST_VERSION" = "$APP_VERSION"
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceLift-${{ steps.version.outputs.version }}-dmg
          path: build/FaceLift.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: FaceLift ${{ steps.version.outputs.version }}
          files: build/FaceLift.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
